name: Android Build and Release

on:
  pull_request:
    branches: ["**"]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Guard against forbidden commit ancestry
        run: |
          BAD_COMMIT="ad3fc96d779c00aded0206e3a7c11b9cbb50795a"
          if git merge-base --is-ancestor "$BAD_COMMIT" HEAD 2>/dev/null; then
            echo "Forbidden commit $BAD_COMMIT found in branch ancestry"
            exit 1
          fi
          echo "Forbidden commit not present in ancestry"
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

  build-release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Guard against forbidden commit ancestry
        run: |
          BAD_COMMIT="ad3fc96d779c00aded0206e3a7c11b9cbb50795a"
          if git merge-base --is-ancestor "$BAD_COMMIT" HEAD 2>/dev/null; then
            echo "Forbidden commit $BAD_COMMIT found in branch ancestry"
            exit 1
          fi
          echo "Forbidden commit not present in ancestry"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tesla-ble-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Release and upload APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
